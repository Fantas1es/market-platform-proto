syntax = "proto3";

package alert;

option go_package = "github.com/USERNAME/market-platform-proto/gen/go/alert";

service AlertService {
  rpc CreateAlert(CreateAlertRequest) returns (CreateAlertResponse);
  rpc GetAlerts(GetAlertsRequest) returns (GetAlertsResponse);
  rpc UpdateAlert(UpdateAlertRequest) returns (UpdateAlertResponse);
  rpc DeleteAlert(DeleteAlertRequest) returns (DeleteAlertResponse);
}

enum Condition {
  CONDITION_UNSPECIFIED = 0;
  PRICE_ABOVE = 1;
  PRICE_BELOW = 2;
}

enum AlertStatus {
  ALERT_STATUS_UNSPECIFIED = 0;
  ALERT_STATUS_ACTIVE = 1;
  ALERT_STATUS_TRIGGERED = 2;
  ALERT_STATUS_CANCELLED = 3;
}

message Alert {
  int64 id = 1;
  int64 version = 2;
  int64 user_id = 3;
  string symbol = 4;
  Condition condition = 5;
  double target_price = 6;
  AlertStatus status = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
  optional int64 triggered_at = 10;
}

message CreateAlertRequest {
  int64 user_id = 1;
  string symbol = 2;
  Condition condition = 3;
  double target_price = 4;
}

message CreateAlertResponse {
  Alert alert = 1;
}

message GetAlertsRequest {
  int64 user_id = 1;
}

message GetAlertsResponse {
  repeated Alert alerts = 1;
}

message UpdateAlertRequest {
  int64 id = 1;
  int64 version = 2;
  int64 user_id = 3;

  optional double target_price = 4;
  optional Condition condition = 5;
  optional AlertStatus status = 6;
}

message UpdateAlertResponse {
  Alert alert = 1;
}

message DeleteAlertRequest {
  int64 id = 1;
  int64 user_id = 2;
}

message DeleteAlertResponse {}